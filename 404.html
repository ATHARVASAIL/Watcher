<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#06080f" />
    <title>Page not found · Watcher</title>
    <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/css/site.css" />
  </head>
  <body>
    <div class="atmos" aria-hidden="true">
      <span class="orb orb-a"></span>
      <span class="orb orb-b"></span>
      <span class="gridlines"></span>
      <span class="grain"></span>
    </div>
    <main class="notfound">
      <div class="notfound-inner">
        <p class="kicker">Error 404</p>
        <p class="code-404" aria-hidden="true">404</p>
        <h1 class="h2">Nothing <span class="thin">to see here.</span></h1>
        <p class="lead">Watcher looked everywhere. This page doesn't exist.</p>
        <a class="btn btn-solid btn-lg" href="./"><span class="btn-inner">Back to Watcher</span></a>
      </div>
    </main>
  </body>
</html>

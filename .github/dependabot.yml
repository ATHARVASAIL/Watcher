version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    # Keep Playwright pinned to the version whose browsers CI installs; bump deliberately.
    ignore:
      - dependency-name: playwright
        update-types: ['version-update:semver-minor', 'version-update:semver-patch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

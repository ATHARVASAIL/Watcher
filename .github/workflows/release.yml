name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Tag must match the manifest version
        run: |
          version="v$(node -p "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8')).version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - run: npm run lint
      - run: npm run check:manifest
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: 'Build (reproducible, timestamps pinned to the tagged commit)'
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.zip

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag

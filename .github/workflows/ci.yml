name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs opt in to more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint (incl. no-unsanitized DOM rules)
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Manifest security policy
        run: npm run check:manifest

      - name: WCAG contrast (light + dark)
        run: npm run check:contrast

      - name: Rules documentation is current
        run: npm run docs:rules:check

      - name: Unit tests
        run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (real Chromium, extension loaded)
        run: npm run test:e2e

      - name: Build extension package
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: watcher
          path: dist/
          if-no-files-found: error
          retention-days: 14

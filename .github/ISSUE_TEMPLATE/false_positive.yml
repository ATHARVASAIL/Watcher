name: False positive / missed secret
description: A rule flagged something harmless, or missed something it should catch.
labels: [detection]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Do not paste real credentials.** Recreate the shape of the value with fake characters
        (keep the prefix and length, change everything else).
  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - False positive (flagged but harmless)
        - False negative (missed a real secret format)
        - Wrong severity / classification
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule ID (if flagged)
      placeholder: generic-secret-assignment
  - type: textarea
    id: sample
    attributes:
      label: Minimal sample (fake values only)
      render: javascript
      placeholder: 'const cfg = { apiKey: "YOUR_FAKE_VALUE" };'
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is the current result wrong?
    validations:
      required: true

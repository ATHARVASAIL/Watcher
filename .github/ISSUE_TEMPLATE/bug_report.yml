name: Bug report
description: Something in the extension doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **Never paste real secrets, tokens or private URLs into an issue.** Replace them with fake values.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a page that …
        2. Click Scan …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: v0.2.0 (shown in the popup header)
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version and OS
      placeholder: Chrome 140 on macOS 15
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else? (screenshots with secrets masked, console errors)
